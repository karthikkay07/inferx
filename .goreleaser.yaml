version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: inferbolt
    main: ./cmd/inferbolt
    binary: inferbolt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: inferbolt
    name_template: "inferbolt_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: inferbolthq
    name: inferbolt
  draft: false
  prerelease: auto
  name_template: "InferBolt {{.Tag}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
