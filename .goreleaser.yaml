version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: inferbolt
    main: ./cmd/inferbolt
    binary: inferbolt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: inferbolt
    name_template: "inferbolt_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: inferbolthq
    name: inferbolt
  draft: false
  prerelease: auto
  name_template: "InferBolt {{.Tag}}"

brews:
  - name: inferbolt
    repository:
      owner: inferbolthq
      name: homebrew-tap
    homepage: "https://inferbolt.dev"
    description: "Open source LLM inference optimization toolkit"
    license: "MIT"
    test: |
      system "#{bin}/inferbolt version"
    install: |
      bin.install "inferbolt"

dockers:
  - image_templates:
      - "ghcr.io/inferbolthq/inferbolt:{{ .Tag }}-amd64"
    dockerfile: Dockerfile.inferbolt
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/inferbolthq/inferbolt:{{ .Tag }}-arm64"
    dockerfile: Dockerfile.inferbolt
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/inferbolthq/inferbolt:{{ .Tag }}"
    image_templates:
      - "ghcr.io/inferbolthq/inferbolt:{{ .Tag }}-amd64"
      - "ghcr.io/inferbolthq/inferbolt:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/inferbolthq/inferbolt:latest"
    image_templates:
      - "ghcr.io/inferbolthq/inferbolt:{{ .Tag }}-amd64"
      - "ghcr.io/inferbolthq/inferbolt:{{ .Tag }}-arm64"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
