apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: optimizedinferences.inferbolt.io
spec:
  group: inferbolt.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["model", "engine", "gpuProfile", "replicas", "resources"]
              properties:
                model:
                  type: string
                engine:
                  type: string
                  enum: ["vllm", "sglang", "tensorrt", "llamacpp"]
                gpuProfile:
                  type: string
                  enum: ["a100-80gb", "h100", "l40s", "cpu"]
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 16
                quantization:
                  type: string
                  enum: ["fp8", "int4", "gptq", "awq", ""]
                tensorParallel:
                  type: integer
                  minimum: 1
                maxBatchSize:
                  type: integer
                maxModelLen:
                  type: integer
                autoOptimize:
                  type: boolean
                resources:
                  type: object
                  required: ["gpuCount", "memoryGB", "cpuCores"]
                  properties:
                    gpuCount:
                      type: integer
                    memoryGB:
                      type: integer
                    cpuCores:
                      type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                lastOptimizedAt:
                  type: string
                  format: date-time
                currentConfig:
                  type: string
                benchmarkJobID:
                  type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: optimizedinferences
    singular: optimizedinference
    kind: OptimizedInference
    shortNames:
      - oi